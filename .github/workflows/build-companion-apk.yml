name: Build Signed Companion APK

# Only publish a signed, non-debuggable APK. A debug APK must not be used for
# distribution because this app accesses call logs and can send SMS messages.
on:
  push:
    paths:
      - '**'
      - '.github/workflows/build-companion-apk.yml'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Validate release signing configuration
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ] || [ -z "$KS_PASSWORD" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::Signed release not built. Configure RELEASE_KEYSTORE_B64, RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS in repository Actions secrets. Debug APKs are not published by this workflow."
            exit 1
          fi

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/media-companion-release.jks"
          test -s "$RUNNER_TEMP/media-companion-release.jks"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/media-companion-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -uo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            # Emit each real compiler/AAPT error as its own annotation (cache
            # is disabled above, so warning noise no longer crowds these out).
            grep -nE '^e: |error: |FAILURE:|AAPT:|Unresolved reference|> Task .*FAILED|What went wrong|Caused by' gradle-build.log \
              | head -n 10 | while IFS= read -r line; do
                  echo "::error::$(printf '%s' "$line" | tr -d '\r')"
                done
            exit "$STATUS"
          fi

      - name: Verify release APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          CERTS=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "Signer #1 certificate DN:.*CN=Android Debug"; then
            echo "::error::Release APK appears to use the Android debug certificate."
            exit 1
          fi

      - name: Report APK identity (hash, signer, SDK range)
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          CERT_SHA=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          BADGING=$("$BT/aapt2" dump badging "$APK")
          PKG=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 v\3 (code \2)/p")
          MINSDK=$(echo "$BADGING" | sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p")
          TARGET=$(echo "$BADGING" | sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p")
          PERMS=$(echo "$BADGING" | sed -n "s/^uses-permission: name='android.permission.\([^']*\)'.*/\1/p" | tr '\n' ' ')
          echo "::notice title=APK SHA-256::$SHA"
          echo "::notice title=Signer cert SHA-256::$CERT_SHA"
          echo "::notice title=Package::$PKG minSdk=$MINSDK targetSdk=$TARGET"
          echo "::notice title=Permissions::$PERMS"
          {
            echo "### Release APK identity"
            echo "- Package: $PKG"
            echo "- minSdk / targetSdk: $MINSDK / $TARGET"
            echo "- APK SHA-256: \`$SHA\`"
            echo "- Signer certificate SHA-256: \`$CERT_SHA\`"
            echo "- Permissions: $PERMS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: media-companion-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 14
          if-no-files-found: ignore
