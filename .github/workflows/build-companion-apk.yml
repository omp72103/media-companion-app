name: Build Companion APK

# Compiles the Media companion Android app to a debug APK on every push.
# The APK is uploaded as a downloadable artifact — grab it from the Actions
# run page (no Android Studio or local SDK needed).
#
# This workflow expects this repo to contain the contents of the
# `android-companion-app/` folder AT THE ROOT (i.e. settings.gradle.kts,
# build.gradle.kts, app/, and this .github/ folder all at repo root).

on:
  push:
    paths:
      - '**'
      - '.github/workflows/build-companion-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle-build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo '## Gradle build failed — last 300 lines' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 300 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $STATUS

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: media-companion-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error

      # ── Signed release APK ────────────────────────────────────────────────
      # Runs only once the signing key has been added as repo secrets
      # (Settings → Secrets and variables → Actions):
      #   RELEASE_KEYSTORE_B64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS
      # A release-signed, non-debuggable build is what should be installed on
      # business phones — debug-signed APKs are treated as high-risk by
      # Play Protect and by payment apps' security checks.
      - name: Build signed release APK
        id: release
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Release signing secrets not set — skipping signed build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        if: steps.release.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: media-companion-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: error